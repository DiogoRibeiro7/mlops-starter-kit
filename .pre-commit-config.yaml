repos:
  - repo: local
    hooks:
      - id: format
        name: Black
        entry: poetry run black
        language: system
        types: [python]
      - id: lint
        name: Flake8
        entry: poetry run flake8
        language: system
        types: [python]
      - id: types
        name: Mypy
        entry: poetry run mypy
        language: system
        pass_filenames: false
        types: [python]
