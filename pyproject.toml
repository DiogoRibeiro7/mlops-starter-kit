[project]
name = "mlops-starter-kit"
version = "0.1.0"
description = "Package-first starter kit for reproducible MLOps projects"
authors = [{ name = "Diogo Ribeiro" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<3.15"
keywords = ["mlops", "machine-learning", "template", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115,<1",
    "filelock>=3.16,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "PyYAML>=6.0.2,<7",
    "scikit-learn>=1.5,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
deep-learning = ["torch>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/mlops-starter-kit"
Repository = "https://github.com/DiogoRibeiro7/mlops-starter-kit"
Issues = "https://github.com/DiogoRibeiro7/mlops-starter-kit/issues"
Documentation = "https://github.com/DiogoRibeiro7/mlops-starter-kit/tree/main/docs"

[project.scripts]
mlops-starter-kit = "mlops_starter_kit.scripts:main"

[tool.poetry]
packages = [{ include = "mlops_starter_kit", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = ">=24,<27"
flake8 = ">=7,<8"
httpx2 = ">=2,<3"
mypy = ">=1.11,<3"
pandas-stubs = ">=2.2,<4"
pre-commit = ">=4,<5"
pytest = ">=8,<10"
pytest-cov = ">=6,<8"
types-PyYAML = ">=6,<7"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
filterwarnings = [
    "error",
    # Starlette 1.6 still imports this deprecated AnyIO alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["mlops_starter_kit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
files = ["src/mlops_starter_kit"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.black]
line-length = 79
target-version = ["py310"]

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
