name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          flake8 src/ tests/
      - name: Test
        run: |
          pytest --maxfail=1 --disable-warnings -q
      - name: Build Train Image
        run: docker build -f docker/train.Dockerfile -t mlops-starter-kit:train .
      - name: Build Serve Image
        run: docker build -f docker/serve.Dockerfile -t mlops-starter-kit:serve .
      - name: Integration Tests
        run: |
          pytest tests/integration --maxfail=1 --disable-warnings -q
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker images
        run: |
          docker tag mlops-starter-kit:train ${{ secrets.DOCKERHUB_USERNAME }}/mlops-starter-kit:train-${{ github.sha }}
          docker tag mlops-starter-kit:serve ${{ secrets.DOCKERHUB_USERNAME }}/mlops-starter-kit:serve-${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-starter-kit:train-${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mlops-starter-kit:serve-${{ github.sha }}
