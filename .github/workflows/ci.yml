name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install
      - name: Lint
        run: |
          poetry run flake8 src/ tests/
      - name: Test
        run: |
          poetry run pytest --cov=src --cov-report=xml --maxfail=1 --disable-warnings -q
      - name: Upload coverage
        uses: actions/upload-artifact@v3
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Integration Tests
        run: |
          poetry run pytest tests/integration --maxfail=1 --disable-warnings -q
      - name: Smoke test container
        run: |
          docker build -f docker/serve.Dockerfile -t mlops-starter-kit:serve .
          docker run -d -p 8000:8000 --name api mlops-starter-kit:serve
          sleep 5
          curl -f http://localhost:8000/
          docker stop api
