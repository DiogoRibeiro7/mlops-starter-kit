name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.2.1"
  POETRY_NO_INTERACTION: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install "poetry==$POETRY_VERSION"
      - run: poetry sync
      - run: poetry check --lock
      - run: poetry run black --check src tests scripts
      - run: poetry run flake8 src tests scripts
      - run: poetry run mypy

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.2.1
      - run: poetry sync
      - run: poetry run pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Installed Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pip install "poetry==$POETRY_VERSION"
      - run: poetry sync
      - run: poetry build
      - run: poetry run pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify imports come from the wheel
        run: |
          poetry run python -c "from pathlib import Path; import mlops_starter_kit as m; assert not Path(m.__file__).is_relative_to(Path.cwd() / 'src')"
      - run: poetry run pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build training and serving targets
        run: |
          docker build --target train -t mlops-starter-kit:train .
          docker build --target serve -t mlops-starter-kit:serve .
      - name: Train a model and serve predictions
        run: |
          docker volume create model-artifacts
          trap 'docker logs api 2>/dev/null || true; docker rm -f api 2>/dev/null || true; docker volume rm model-artifacts' EXIT
          docker run --rm -v model-artifacts:/app/artifacts mlops-starter-kit:train
          docker run -d -p 8000:8000 --name api \
            -v model-artifacts:/app/artifacts:ro \
            -e MODEL_PATH=/app/artifacts/models/baseline_model/v1.pkl \
            mlops-starter-kit:serve
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 5 http://localhost:8000/readyz
          curl --fail --max-time 5 http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"instances":[{"feature1":1,"feature2":1},{"feature1":4,"feature2":4}]}' \
            | python -c "import json, sys; assert json.load(sys.stdin)['predictions'] == [0, 1]"
