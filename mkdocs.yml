site_name: MLOps Starter Kit
site_description: Python MLOps workflows for reproducible tabular classification.
site_url: https://diogoribeiro7.github.io/mlops-starter-kit/
repo_url: https://github.com/DiogoRibeiro7/mlops-starter-kit
repo_name: GitHub
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8001
strict: true

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/chart-box-outline
    repo: fontawesome/brands/github
  palette:
    primary: teal
    accent: deep orange
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Getting Started:
      - Overview: index.md
      - Quickstart: quickstart.md
      - Example Dataset: dataset.md
  - User Guide:
      - Configuration: configuration.md
      - Workflows: workflows.md
      - Prediction API: serving.md
  - Engineering:
      - Architecture: architecture.md
      - Repository Structure: structure.md
      - Contributing: contributing.md
      - Documentation: documentation.md
  - Project:
      - Roadmap: roadmap.md
      - Releases: releases.md
      - Changelog: changelog.md
      - Security: security.md

plugins:
  - search
  - include-markdown:
      include_from_url: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

watch:
  - CONTRIBUTING.md
  - SECURITY.md
  - CHANGELOG.md
  - data/README.md
